name: Slash command on Retry Automerge

on:
  repository_dispatch:
    types:
      - retry-command

permissions:
  issues: write
  checks: read
  deployments: write
  contents: read
  packages: read
  statuses: write

jobs:
  retry-automerge:
    name: Retry Automerge
    runs-on: ubuntu-latest
    steps:
      - uses: cloudopsworks/automerge-action@v0.17.0
        env:
          GITHUB_TOKEN: "${{ secrets.BOT_TOKEN }}"
          MERGE_COMMIT_MESSAGE: "pull-request-title"
          MERGE_LABELS: "approved,!do-not-merge"
          UPDATE_LABELS: "approved"
          #LOG: "TRACE"
