description: |-
  Manage OpenRouter management-plane controls as code: workspaces, API keys,
  guardrails, guardrail-key assignments, workspace budgets, BYOK credential
  metadata, workspace policies with concurrency-safe subject assignments, SCIM
  group mappings, and write-only observability destinations. Read-only data
  sources cover workspace memberships, model discovery, and dated usage.
  This Terraform/OpenTofu provider focuses on resources with a clear, safe
  infrastructure lifecycle.

introduction: |-
  Manage the OpenRouter controls your team can review and reproduce: scoped API
  keys, workspaces, guardrails, key-to-guardrail assignments, workspace budgets,
  BYOK credential metadata, and typed budget/model-availability policies.

  ### Managed capabilities

  | Area | Terraform support |
  | --- | --- |
  | API keys | `openrouter_api_key` |
  | Workspaces | `openrouter_workspace` |
  | Guardrails | `openrouter_guardrail` |
  | Guardrail-key assignments | `openrouter_guardrail_key_assignment` |
  | Workspace budgets | `openrouter_workspace_budget` |
  | BYOK credentials | `openrouter_byok_key` (write-only credential) |
  | Workspace policies | `openrouter_budget_policy`, `openrouter_model_availability_policy` |
  | Direct policy assignments | `openrouter_api_key_policy_assignment`, `openrouter_member_policy_assignment` |
  | SCIM group mappings | `openrouter_scim_group_mapping` (existing IdP groups) |
  | Observability destinations | `openrouter_observability_destination` (write-only configuration) |
  | Discovery and snapshots | SCIM groups, workspace members, models, dated activity data sources |

  ### Resources

  - `openrouter_api_key` — keys with spend and time limits
  - `openrouter_workspace`
  - `openrouter_guardrail`
  - `openrouter_guardrail_key_assignment`
  - `openrouter_workspace_budget`
  - `openrouter_byok_key`
  - `openrouter_budget_policy`
  - `openrouter_model_availability_policy`
  - `openrouter_api_key_policy_assignment`
  - `openrouter_member_policy_assignment`
  - `openrouter_scim_group_mapping`
  - `openrouter_observability_destination`

  ### Data sources

  - `openrouter_workspace`
  - `openrouter_workspaces`
  - `openrouter_api_keys`
  - `openrouter_guardrails`
  - `openrouter_organization` — reads organization information; it does not manage members
  - `openrouter_providers`
  - `openrouter_byok_keys`
  - `openrouter_scim_groups`
  - `openrouter_workspace_members` — read-only, including implicit memberships
  - `openrouter_model` — single model lookup
  - `openrouter_models` — bounded catalog page
  - `openrouter_activity` — explicit-date usage snapshot

quickstart: |-
  ## Requirements

  - Go `>= 1.26.3` for development
  - Terraform `>= 1.11`
  - OpenTofu `>= 1.11`
  - OpenRouter management API key

  The provider globally advertises a write-only BYOK credential argument. Terraform
  and OpenTofu must support write-only arguments even if a configuration does not
  use `openrouter_byok_key`; this sets the provider-wide `>= 1.11` minimum.

  ## Installation

  ### Terraform

  ```hcl
  terraform {
    required_providers {
      openrouter = {
        source  = "cloudopsworks/openrouter"
        version = "~> 0.1"
      }
    }
  }
  ```

  ### OpenTofu

  After the provider is published to the OpenTofu Registry, use the same namespace/type pair:

  ```hcl
  terraform {
    required_providers {
      openrouter = {
        source  = "cloudopsworks/openrouter"
        version = "~> 0.1"
      }
    }
  }
  ```

usage: |-
  ## Provider configuration

  ```hcl
  provider "openrouter" {
    api_key = var.openrouter_management_key
  }
  ```

  You can also set `OPENROUTER_API_KEY` instead of `api_key`.

  Optional arguments:

  - `api_key` - OpenRouter management API key. Highest-precedence key source.
  - `base_url` - Override the management API base URL. Defaults to `https://openrouter.ai/api/v1`.
  - `aws_secrets_manager` - Read provider settings from AWS Secrets Manager using the default AWS credential chain, with optional STS AssumeRole support.
  - `gcp_secret_manager` - Read provider settings from Google Secret Manager using Application Default Credentials, with optional service-account impersonation.
  - `azure_key_vault` - Read the management API key from Azure Key Vault using `DefaultAzureCredential`.

  Authentication is resolved in this order: explicit provider values, direct
  environment values, then exactly one configured or discovered cloud secret
  source. Direct values override fields from a secret, and a direct key causes
  cloud sources to be ignored completely. Missing, ambiguous, inaccessible,
  malformed, or empty cloud sources fail provider configuration when cloud
  resolution is required.

  ```hcl
  provider "openrouter" {
    aws_secrets_manager = {
      region        = "us-east-1"
      secret_id     = "prod/openrouter/management"
      version_stage = "AWSCURRENT"
      json_key      = "api_key"
    }
  }
  ```

  ```hcl
  provider "openrouter" {
    gcp_secret_manager = {
      project_id = "platform-prod"
      secret_id  = "openrouter-management-key"
      version    = "latest"
      json_key   = "api_key"
    }
  }
  ```

  ```hcl
  provider "openrouter" {
    azure_key_vault = {
      vault_url   = "https://platform-prod.vault.azure.net/"
      secret_name = "openrouter-management-key"
      json_key    = "api_key"
    }
  }
  ```

  Cloud source discovery is also available through
  `OPENROUTER_AWS_SECRETS_MANAGER_*` and
  `OPENROUTER_GCP_SECRET_MANAGER_*` environment variables. Secret values may be
  plaintext keys or JSON objects containing `api_key`/`openrouter_api_key` and
  optional `base_url`; use `json_key` for nested JSON values.

  ## Govern a team's access (not just a bare key)

  ```hcl
  # Scope a workspace, guard an API key, and set a workspace budget.
  resource "openrouter_workspace" "search_team" {
    name = "Search Team"
    slug = "search-team"
  }

  resource "openrouter_guardrail" "search_team" {
    name              = "search-team"
    workspace_id      = openrouter_workspace.search_team.id
    limit_usd         = 200 # monthly USD cap
    reset_interval    = "monthly"
    allowed_providers = ["openai", "anthropic"]

    enforce_zdr_anthropic = true
    enforce_zdr_google    = false
    enforce_zdr_openai    = true
    enforce_zdr_other     = false

    content_filter_builtins = [
      {
        slug   = "email"
        action = "redact"
      }
    ]
  }

  resource "openrouter_api_key" "search_team" {
    name         = "search-team-prod"
    workspace_id = openrouter_workspace.search_team.id
    limit        = 200 # USD spend cap
    limit_reset  = "monthly"
  }

  resource "openrouter_guardrail_key_assignment" "search_team" {
    guardrail_id = openrouter_guardrail.search_team.id
    key_hash     = openrouter_api_key.search_team.id
  }

  resource "openrouter_workspace_budget" "search_team_monthly" {
    workspace_id = openrouter_workspace.search_team.id
    interval     = "monthly"
    limit_usd    = 200
  }
  ```

  See [`examples/governance/`](examples/governance/) for a multi-team version that
  governs every team from a single `for_each`.

  ## Development

  ```sh
  make fmt
  make lint
  make test
  make build
  ```

  For acceptance tests:

  ```sh
  make testacc
  ```

examples: |-
  See:

  - `examples/provider/`
  - `examples/resources/`
  - `examples/data-sources/`
  - `examples/policies/` — native workspace policies and direct subject assignments
  - `examples/management-plane/` — SCIM, write-only observability, model and activity discovery
  - `docs/`

  ## Policy ownership

  Policy resources manage native, non-default workspace policies. Budget policies
  apply per member/API key; use `openrouter_workspace_budget` for aggregate spend.
  Configuration updates replace the policy config but preserve externally managed
  subject assignments. Separate assignment resources use OpenRouter optimistic
  concurrency checks and refuse to overwrite existing direct assignments.

  Legacy-mapped policies, account policies, defaults, and default opt-outs are not
  managed by these resources. Do not manage the same controls through both legacy
  guardrails and policies. See [policy examples](examples/policies/) and the
  [management-plane roadmap](docs/roadmap.md) for scope and migration constraints.

  ## Known limitations in v1

  - OpenRouter returns the actual API key secret only on create. The provider exposes it as `key` and marks it sensitive, but it can still exist in state.
  - The provider requires Terraform/OpenTofu `>= 1.11` because it advertises the write-only `openrouter_byok_key.key_wo` argument globally. Its raw credential is never stored in state and cannot be drift-detected.
  - `openrouter_organization` is a read-only data source; the provider does not manage organization members.
  - Workspace memberships are read-only until default/implicit and SCIM ownership can be identified reliably. SCIM support manages group mappings, not directory identities or one-shot sync jobs.
  - Observability configuration is write-only and merge-updated using a revision marker; returned configuration is discarded and secret drift cannot be detected. Destinations default to disabled/privacy mode enabled; S3 IAM-role bootstrap and filter-rule ownership are not included.
  - Model and activity data sources are snapshots, not availability or billing guarantees. Activity uses an explicit date within the API's rolling completed-UTC-day retention window.

  ## Registry publishing

  This repository includes HashiCorp scaffolding-style release packaging for Terraform Registry/OpenTofu Registry publication:

  - `.goreleaser.yml`
  - `.github/workflows/release.yml`
  - `terraform-registry-manifest.json`

  Release details and the remaining registry-side manual steps are documented in [`RELEASING.md`](./RELEASING.md).

