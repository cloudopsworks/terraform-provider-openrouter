description: |-
  Manage OpenRouter management-plane controls as code: workspaces, API keys,
  guardrails, guardrail-key assignments, workspace budgets, and BYOK credential
  metadata. This Terraform/OpenTofu provider focuses on resources with a clear,
  safe infrastructure lifecycle.

introduction: |-
  Manage the OpenRouter controls your team can review and reproduce: scoped API
  keys, workspaces, guardrails, key-to-guardrail assignments, workspace budgets,
  and BYOK credential metadata.

  ### Managed capabilities

  | Area | Terraform support |
  | --- | --- |
  | API keys | `openrouter_api_key` |
  | Workspaces | `openrouter_workspace` |
  | Guardrails | `openrouter_guardrail` |
  | Guardrail-key assignments | `openrouter_guardrail_key_assignment` |
  | Workspace budgets | `openrouter_workspace_budget` |
  | BYOK credentials | `openrouter_byok_key` (write-only credential) |

  ### Resources

  - `openrouter_api_key` — keys with spend and time limits
  - `openrouter_workspace`
  - `openrouter_guardrail`
  - `openrouter_guardrail_key_assignment`
  - `openrouter_workspace_budget`
  - `openrouter_byok_key`

  ### Data sources

  - `openrouter_workspace`
  - `openrouter_workspaces`
  - `openrouter_api_keys`
  - `openrouter_guardrails`
  - `openrouter_organization` — reads organization information; it does not manage members
  - `openrouter_providers`
  - `openrouter_byok_keys`

quickstart: |-
  ## Requirements

  - Go `>= 1.26.3` for development
  - Terraform `>= 1.11`
  - OpenTofu `>= 1.11`
  - OpenRouter management API key

  The provider globally advertises a write-only BYOK credential argument. Terraform
  and OpenTofu must support write-only arguments even if a configuration does not
  use `openrouter_byok_key`; this sets the provider-wide `>= 1.11` minimum.

  ## Installation

  ### Terraform

  ```hcl
  terraform {
    required_providers {
      openrouter = {
        source  = "cloudopsworks/openrouter"
        version = "~> 0.1"
      }
    }
  }
  ```

  ### OpenTofu

  After the provider is published to the OpenTofu Registry, use the same namespace/type pair:

  ```hcl
  terraform {
    required_providers {
      openrouter = {
        source  = "cloudopsworks/openrouter"
        version = "~> 0.1"
      }
    }
  }
  ```

usage: |-
  ## Provider configuration

  ```hcl
  provider "openrouter" {
    api_key = var.openrouter_management_key
  }
  ```

  You can also set `OPENROUTER_API_KEY` instead of `api_key`.

  Optional arguments:

  - `api_key` - OpenRouter management API key. Highest-precedence key source.
  - `base_url` - Override the management API base URL. Defaults to `https://openrouter.ai/api/v1`.
  - `aws_secrets_manager` - Read provider settings from AWS Secrets Manager using the default AWS credential chain, with optional STS AssumeRole support.
  - `gcp_secret_manager` - Read provider settings from Google Secret Manager using Application Default Credentials, with optional service-account impersonation.
  - `azure_key_vault` - Read the management API key from Azure Key Vault using `DefaultAzureCredential`.

  Authentication is resolved in this order: explicit provider values, direct
  environment values, then exactly one configured or discovered cloud secret
  source. Direct values override fields from a secret, and a direct key causes
  cloud sources to be ignored completely. Missing, ambiguous, inaccessible,
  malformed, or empty cloud sources fail provider configuration when cloud
  resolution is required.

  ```hcl
  provider "openrouter" {
    aws_secrets_manager = {
      region        = "us-east-1"
      secret_id     = "prod/openrouter/management"
      version_stage = "AWSCURRENT"
      json_key      = "api_key"
    }
  }
  ```

  ```hcl
  provider "openrouter" {
    gcp_secret_manager = {
      project_id = "platform-prod"
      secret_id  = "openrouter-management-key"
      version    = "latest"
      json_key   = "api_key"
    }
  }
  ```

  ```hcl
  provider "openrouter" {
    azure_key_vault = {
      vault_url   = "https://platform-prod.vault.azure.net/"
      secret_name = "openrouter-management-key"
      json_key    = "api_key"
    }
  }
  ```

  Cloud source discovery is also available through
  `OPENROUTER_AWS_SECRETS_MANAGER_*` and
  `OPENROUTER_GCP_SECRET_MANAGER_*` environment variables. Secret values may be
  plaintext keys or JSON objects containing `api_key`/`openrouter_api_key` and
  optional `base_url`; use `json_key` for nested JSON values.

  ## Govern a team's access (not just a bare key)

  ```hcl
  # Scope a workspace, guard an API key, and set a workspace budget.
  resource "openrouter_workspace" "search_team" {
    name = "Search Team"
    slug = "search-team"
  }

  resource "openrouter_guardrail" "search_team" {
    name              = "search-team"
    workspace_id      = openrouter_workspace.search_team.id
    limit_usd         = 200 # monthly USD cap
    reset_interval    = "monthly"
    allowed_providers = ["openai", "anthropic"]

    enforce_zdr_anthropic = true
    enforce_zdr_google    = false
    enforce_zdr_openai    = true
    enforce_zdr_other     = false

    content_filter_builtins = [
      {
        slug   = "email"
        action = "redact"
      }
    ]
  }

  resource "openrouter_api_key" "search_team" {
    name         = "search-team-prod"
    workspace_id = openrouter_workspace.search_team.id
    limit        = 200 # USD spend cap
    limit_reset  = "monthly"
  }

  resource "openrouter_guardrail_key_assignment" "search_team" {
    guardrail_id = openrouter_guardrail.search_team.id
    key_hash     = openrouter_api_key.search_team.id
  }

  resource "openrouter_workspace_budget" "search_team_monthly" {
    workspace_id = openrouter_workspace.search_team.id
    interval     = "monthly"
    limit_usd    = 200
  }
  ```

  See [`examples/governance/`](examples/governance/) for a multi-team version that
  governs every team from a single `for_each`.

  ## Development

  ```sh
  make fmt
  make lint
  make test
  make build
  ```

  For acceptance tests:

  ```sh
  make testacc
  ```

