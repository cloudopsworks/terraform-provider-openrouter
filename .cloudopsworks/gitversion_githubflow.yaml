mode: ContinuousDelivery
label: "{BranchName}"
increment: Inherit
prevent-increment:
  of-merged-branch: false
  when-branch-merged: false
  when-current-commit-tagged: true
track-merge-target: false
track-merge-message: true
commit-message-incrementing: Enabled
regex: ''
source-branches: []
is-source-branch-for: []
tracks-release-branches: false
is-release-branch: false
is-main-branch: false
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
tag-prefix: "[vV]?"
version-in-branch-pattern: "(?<version>[vV]?\\d+(\\.\\d+)?(\\.\\d+)?).*"
major-version-bump-message: "\\+semver:\\s?(major|breaking)"
minor-version-bump-message: "\\+semver:\\s?(feature|minor)"
patch-version-bump-message: "\\+semver:\\s?(fix|patch|hotfix)"
no-bump-message: "\\+semver:\\s?(none|skip)"
tag-pre-release-weight: 60000
commit-date-format: yyyy-MM-dd
merge-message-formats:
  conventional-commits-merge: "^(?<type>build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\((?<scope>.*)\\))?(!)?: Merge pull request #(?<PullRequestNumber>\\d+) from (?<SourceBranch>.*)"
  direct-commits-merge: "^Merge pull request #(?<PullRequestNumber>\\d+) from (?<SourceBranch>.*)"
  feat-finish: "^chore: Feature Finish from (?<SourceBranch>.*).*"
  hotfix-finish: "^chore: Hotfix Release from (?<SourceBranch>.*).*"
  release-finish: "^chore: Release v\\d+\\.\\d+\\.\\d+.* from (?<SourceBranch>.*).*"
update-build-number: true
semantic-version-format: Strict
strategies:
  - Fallback
  - ConfiguredNextVersion
  - MergeMessage
  - TaggedCommit
  - TrackReleaseBranches
  - VersionInBranchName
branches:
  main:
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
    track-merge-message: true
    regex: "^master$|^main$"
    source-branches: []
    is-source-branch-for: []
    tracks-release-branches: false
    is-release-branch: false
    is-main-branch: true
    pre-release-weight: 55000
  release:
    mode: ManualDeployment
    label: beta
    increment: Patch
    prevent-increment:
      of-merged-branch: true
      when-branch-merged: false
      when-current-commit-tagged: false
    track-merge-target: false
    track-merge-message: true
    regex: "^releases?[\\/-](?<BranchName>[vV]?\\d+\\.\\d+\\.\\d+.*)"
    source-branches:
      - main
    is-source-branch-for: []
    tracks-release-branches: false
    is-release-branch: true
    is-main-branch: false
    pre-release-weight: 30000
  feature:
    mode: ManualDeployment
    label: alpha
    increment: Inherit
    prevent-increment:
      when-current-commit-tagged: false
    track-merge-message: true
    regex: "^features?[\\/-](?<BranchName>.+)"
    source-branches:
      - main
      - release
    is-source-branch-for: []
    is-main-branch: false
    pre-release-weight: 30000
  pull-request:
    mode: ContinuousDelivery
    label: "PullRequest{Number}"
    increment: Inherit
    prevent-increment:
      of-merged-branch: true
      when-current-commit-tagged: false
    track-merge-message: true
    regex: "^(pull-requests|pull|pr)[\\/-](?<Number>\\d*)"
    source-branches:
      - main
      - release
      - feature
    is-source-branch-for: []
    pre-release-weight: 30000
  hotfix:
    mode: ManualDeployment
    label: beta
    increment: Inherit
    prevent-increment:
      when-current-commit-tagged: false
    regex: "^(hotfix|fix)(es)?[\\/-](?<BranchName>[vV]?\\d+\\.\\d+\\.\\d+.*)"
    source-branches:
      - main
      - support
    is-source-branch-for: []
    is-release-branch: true
    is-main-branch: false
    pre-release-weight: 30000
  unknown:
    mode: ManualDeployment
    label: "{BranchName}"
    increment: Inherit
    prevent-increment:
      when-current-commit-tagged: false
    track-merge-message: false
    regex: "(?<BranchName>.+)"
    source-branches:
      - main
      - release
      - feature
      - pull-request
    is-source-branch-for: []
    is-main-branch: false
ignore:
  sha: []
  paths: []
